services:
  db:
    restart: unless-stopped
    image: postgres:18
    env_file:
      - ./env/db.env
    environment:
      - POSTGRES_HOST=db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    env_file:
      - ./env/minio.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    restart: unless-stopped
    build: ./backend/
    ports:
      - "8080:8080"
    env_file:
      - ./env/db.env
      - ./env/jwt_secret.env
      - ./env/minio.env
    environment:
      - POSTGRES_HOST=db
      - MINIO_HOST=minio
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build: ./frontend/
    ports:
      - "3000:3000"
    environment:
      - API_URL=${API_URL}
    depends_on:
      - backend

  caddy:
    restart: unless-stopped
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - minio

volumes:
  pgdata:
  minio_storage:
  caddy_data:
  caddy_config:
