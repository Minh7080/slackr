<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Slackr</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Daisy UI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" type="text/css" media="screen" href="styles/provided.css" />
  </head>

  <body>

    <main role="main">
    </main>

    <template id="login-page">
      <div class="w-full h-screen flex justify-center items-center">
        <form class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
          <div class="card-body">
            <h2 class="text-primary font-bold text-2xl text-center">Login</h2>
            <fieldset class="fieldset">
              <label class="label" for="login-email">Email</label>
              <input type="email" class="input" placeholder="Email" required id="login-email" />
              <label class="label" for="login-password">Password</label>
              <input type="password" class="input" placeholder="Password" required id="login-password" />
              <div>Don't have an account? <a class="link link-primary" id="register-link">Register here</a></div>
              <button class="btn btn-primary mt-4" id="login-submit">Login</button>
            </fieldset>
          </div>
        </form>
      </div>
    </template>
    <template id="register-page">
      <div class="w-full h-screen flex justify-center items-center">
        <form class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
          <div class="card-body">
            <h2 class="text-primary font-bold text-2xl text-center">Register</h2>
            <fieldset class="fieldset">
              <label class="label" for="register-name">Name</label>
              <input type="text" class="input" placeholder="Name" required id="register-name" />

              <label class="label" for="register-email">Email</label>
              <input type="email" class="input" placeholder="Email" required id="register-email" />

              <label class="label" for="register-password">Password</label>
              <input type="password" class="input" placeholder="Password" required id="register-password" />

              <label class="label" for="register-password-confirm">Retype password</label>
              <input type="password" class="input" placeholder="Retype Password" required id="register-password-confirm" />

              <div>Already have an account? <a class="link link-primary" id="login-link">Login here</a></div>
              <button class="btn btn-primary mt-4" id="register-submit">Register</button>
            </fieldset>
          </div>
        </form>
      </div>
    </template>

    <template id="home-page">
      <p>Dashboard</p>
      <div id="dashboard-container"></div>
      <button class="btn btn-error" id="logout-button">Logout</button>
    </template>

    <template id="error-toast-component">
      <div class="alert alert-error transition duration-200 ease-out">
        <span id="error-body">message</span>
        <button class="btn btn-circle btn-error btn-xs btn-ghost" id="error-close">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </template>

    <script type="module" src="src/main.js"></script>
  </body>

</html>
